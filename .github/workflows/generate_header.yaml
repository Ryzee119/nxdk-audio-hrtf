name: Generate and Release HRTF Header

on:
  release:
    types: [created]
  workflow_dispatch: # Allows manual triggering from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install h5py

    - name: Generate C Header
      run: |
        python convert_hrtf.py KEMAR_GRAS_EarSim_LargeEars_FreeFieldCompMinPhase_48kHz.sofa -o nxaudio_hrtf.h

    - name: Upload Release Asset
      uses: softprops/action-gh-release@v2
      # Only upload if the workflow was triggered by a tag/release
      if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
      with:
        files: nxaudio_hrtf.h
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
